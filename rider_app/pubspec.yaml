name: rider_app
description: "JnU Live Bus Tracker - Rider App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # HTTP & WebSocket
  http: ^1.2.0
  web_socket_channel: ^2.4.5
  
  # Maps
  google_maps_flutter: ^2.6.1
  
  # Connectivity
  connectivity_plus: ^6.0.3
  
  # State Management
  provider: ^6.1.2
  
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
